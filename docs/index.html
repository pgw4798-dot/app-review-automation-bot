<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>앱 리뷰 자동화 봇 · CS 콘솔</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2230;--mute:#6b7385;--line:#e4e7ee;--brand:#4f46e5;--brand-soft:#eef0ff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--side:#151a2b}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);display:flex;min-height:100vh}
aside{width:224px;background:var(--side);color:#c9cfe0;padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column}
aside h1{font-size:15px;color:#fff;margin:0 8px 2px}
aside .sub{font-size:11px;margin:0 8px 18px;color:#8b93ad}
.nav button{display:flex;width:100%;align-items:center;gap:8px;background:none;border:0;color:inherit;padding:10px;border-radius:8px;font:inherit;cursor:pointer;text-align:left}
.nav button:hover{background:#22294a}
.nav button.on{background:var(--brand);color:#fff}
.nav .cnt{margin-left:auto;background:#2d3560;color:#fff;border-radius:10px;padding:0 7px;font-size:11px}
.nav button.on .cnt{background:#ffffff33}
.who{margin-top:auto;font-size:12px;color:#8b93ad;padding:8px}
.who b{color:#fff;display:block}
main{flex:1;min-width:0;padding:22px 26px 60px}
h2{margin:0 0 4px;font-size:20px}
.lead{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer;color:var(--ink)}
.btn:hover{background:#f1f3f9}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}.btn.p:hover{background:#4338ca}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.ok:hover{background:#15803d}
.btn.sm{padding:4px 9px;font-size:12px;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=search],textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink)}
textarea{width:100%;resize:vertical;min-height:96px}
.chip{display:inline-block;border-radius:20px;padding:1px 9px;font-size:12px;background:#eef0f5;color:#394056;white-space:nowrap}
.stat{cursor:pointer}.stat .n{font-size:24px;font-weight:700}.stat .l{color:var(--mute);font-size:12px}
.stars{color:#f59e0b;letter-spacing:1px}
.split{display:grid;grid-template-columns:minmax(340px,430px) 1fr;gap:14px;align-items:start}
.list{max-height:calc(100vh - 250px);overflow:auto;padding:0}
.item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:#f8f9fc}.item.sel{background:var(--brand-soft)}
.item .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:4px 0}
.meta{font-size:12px;color:var(--mute)}
.st{font-size:11px;border-radius:4px;padding:1px 6px;font-weight:600}
.st.new{background:#fee2e2;color:#b91c1c}.st.drafted{background:#fef3c7;color:#b45309}.st.approved{background:#dbeafe;color:#1d4ed8}.st.published{background:#dcfce7;color:#15803d}.st.skipped{background:#e5e7eb;color:#4b5563}
.risk{background:#fee2e2;color:#b91c1c;font-size:11px;border-radius:4px;padding:1px 6px;font-weight:700}
.warnbox{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}
.errbox{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}
.okbox{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600}
.delta.up{color:var(--bad)}.delta.dn{color:var(--ok)}.delta.flat{color:var(--mute)}
.bar{height:10px;background:#eceef5;border-radius:5px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:5px}
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:6px 0 12px}
.flow b{background:#fff;border:1px solid var(--line);padding:2px 8px;border-radius:6px;color:var(--ink)}
.flow b.hl{background:var(--brand);color:#fff;border-color:var(--brand)}
.toast{position:fixed;right:20px;bottom:20px;background:#1c2230;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.issue{border-left:4px solid var(--brand);padding:12px 14px;background:#fff;border-radius:8px;border:1px solid var(--line);border-left-width:4px;margin-bottom:10px}
.issue h4{margin:0 0 6px;font-size:15px}
.quote{border-left:3px solid #d5d9e6;padding:2px 10px;color:#394056;margin:4px 0;font-size:13px}
.hm td{text-align:center;padding:5px 4px;font-size:12px;border:1px solid #fff}
.switch{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border:0}.switch .d{color:var(--mute);font-size:12px}
.lock{color:var(--mute);font-size:12px}
.demo{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:6px 10px;font-size:12px;margin-bottom:14px}
@media(max-width:900px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:8px}.nav{display:flex;gap:4px;flex-wrap:wrap}.who{display:none}.split{grid-template-columns:1fr}.list{max-height:none}main{padding:14px}}
@media print{aside,.noprint{display:none!important}main{padding:0}body{background:#fff}}
</style>
</head>
<body>
<aside>
  <h1>앱 리뷰 자동화 봇</h1>
  <div class="sub">CS 콘솔 · review-orchestrator</div>
  <nav class="nav" id="nav"></nav>
  <div class="who"><b>CS 담당자</b><span id="whoName"></span></div>
</aside>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script src="data/toss-reviews.js"></script>
<script>
/* ============ 상수 ============ */
const VOC=['버그·오류','성능·속도','로그인·인증','송금·결제','UX·사용성','기능 요청','고객지원·응대','수수료·금리','증권·투자','광고·리워드','보안·사기','칭찬·만족','기타'];
const VCOL={'버그·오류':'#ef4444','성능·속도':'#f97316','로그인·인증':'#a855f7','송금·결제':'#e11d48','UX·사용성':'#0ea5e9','기능 요청':'#14b8a6','고객지원·응대':'#eab308','수수료·금리':'#64748b','증권·투자':'#2563eb','광고·리워드':'#d946ef','보안·사기':'#7f1d1d','칭찬·만족':'#22c55e','기타':'#9ca3af'};
const STLABEL={new:'미답변',drafted:'초안 완료',approved:'승인됨',published:'게시 완료',skipped:'제외'};
const LIMIT={googleplay:350,appstore:700};
const STORE={appstore:'App Store',googleplay:'Google Play'};
const DAY=86400000, KST=9*3600000, KEY='rvbot_toss_v1';
const RISK_RE=/사기|피싱|해킹|도용|유출|고소|소송|신고|금감원|소비자원|언론|무단|명의|보이스|사칭|돈이 ?(빠|사라|없)|잔액 ?(이)? ?(사라|없|틀)|이중|두 ?번 ?(빠|결제|출금)|미성년/;
const PII_RE=/(01[016789][- .]?\d{3,4}[- .]?\d{4})|([\w.+-]+@[\w-]+\.[\w.]+)/;
const ACTION={
'버그·오류':['개발 · QA','재현 조건 수집 후 크래시·오류 로그와 리뷰 버전 매칭, 핫픽스 우선순위 검토'],
'성능·속도':['개발 · 인프라','주요 화면 로딩 지표(P95)와 배터리·발열 회귀 여부 점검'],
'로그인·인증':['개발 · 보안 · PM','본인/얼굴 인증 요청 빈도와 이탈 구간 점검, 인증 유도 노출 정책 재검토'],
'송금·결제':['결제 · 개발 · CS','송금·결제·충전 실패와 중복 처리 로그 점검, 점검 공지 방식 개선'],
'UX·사용성':['디자인 · PM','최근 개편 화면의 이탈·문의 지표 비교, 변경 전 기능(예: 소비 내역 보기) 복원 여부 검토'],
'기능 요청':['PM','요청 빈도 기준 백로그 등록 및 로드맵 검토'],
'고객지원·응대':['CS 운영','상담 연결 시간·응대 SLA 점검, 인입 증가 시간대 인력 배치, 셀프 해결 안내 보강'],
'수수료·금리':['사업 · 금융 PM','수수료·금리·한도 안내 방식 점검, 민감 세그먼트 분석'],
'증권·투자':['증권 개발 · PM','호가창·차트·시세 표시 오류와 지연 점검, 장 시작/마감 시간대 부하 확인'],
'광고·리워드':['그로스 · 광고 · PM','광고 노출 빈도와 리워드 지급 오류 점검, 광고 종료 버튼/지급 로직 확인'],
'보안·사기':['보안 · 법무 · CS','개인정보·사기 언급 건 개별 확인, 안내 문구 점검(고위험으로 별도 에스컬레이션)'],
'칭찬·만족':['PM · 마케팅','강점 키워드를 스토어 설명과 마케팅 문구에 반영'],
'기타':['CS 운영','분류 불가 리뷰 표본 점검 후 분류 규칙 보강']};
const REPLY={
'버그·오류':v=>`이용 중 오류가 발생해 불편을 드려 죄송합니다. 말씀해 주신 증상은 담당 부서에 전달해 원인을 확인하겠습니다. 정확한 확인을 위해 사용 중인 기기와 앱 버전을 {contact}로 알려 주시면 더 빠르게 도와드리겠습니다.`,
'성능·속도':v=>`앱이 느리게 동작해 불편을 드려 죄송합니다. 해당 내용은 담당 부서에 전달해 개선 여부를 점검하겠습니다. 사용 중인 기기와 앱 버전을 {contact}로 알려 주시면 원인 파악에 큰 도움이 됩니다.`,
'로그인·인증':v=>`인증·로그인 과정에서 불편을 드려 죄송합니다. 앱을 최신 버전으로 업데이트한 뒤 다시 시도해 주세요. 계속 어려우시면 {contact}로 문의해 주시면 확인해 드리겠습니다. 인증 방식에 대한 의견은 담당 부서에 전달하겠습니다.`,
'송금·결제':v=>`송금·결제 이용 중 불편을 드려 죄송합니다. 개인 거래 정보는 이 공간에 남기지 마시고, {contact}로 문의해 주시면 거래 내역을 확인해 안내드리겠습니다.`,
'UX·사용성':v=>`사용 중 불편하셨던 점을 말씀해 주셔서 감사합니다. 화면 구성과 사용 흐름에 대한 의견은 담당 부서에 전달해 개선 시 참고하겠습니다.`,
'기능 요청':v=>`소중한 제안 감사합니다. 말씀해 주신 기능은 담당 부서에 전달해 검토하겠습니다. 앞으로도 더 나은 서비스를 위해 의견 부탁드립니다.`,
'고객지원·응대':v=>`문의 처리가 늦어지고 만족스럽지 못한 응대로 불편을 드려 진심으로 죄송합니다. 남겨 주신 내용은 운영 담당과 공유해 개선하겠습니다. 아직 해결되지 않은 문의는 {contact}로 다시 알려 주세요.`,
'수수료·금리':v=>`수수료·금리에 대한 솔직한 의견 감사합니다. 말씀해 주신 내용은 관련 부서에 전달하겠습니다. 이용 중인 상품 안내는 {contact}에서 확인하실 수 있습니다.`,
'증권·투자':v=>`증권 이용 중 불편을 드려 죄송합니다. 말씀해 주신 내용은 담당 부서에 전달해 확인하겠습니다. 불편이 있었던 화면과 기기·앱 버전을 {contact}로 알려 주시면 더 빠르게 확인할 수 있습니다.`,
'광고·리워드':v=>`광고·알림·혜택 이용 중 불편을 드려 죄송합니다. 말씀해 주신 내용은 담당 부서에 전달해 개선을 검토하겠습니다. 혜택이 정상 지급되지 않았다면 {contact}로 문의해 주세요.`,
'보안·사기':v=>`걱정을 드려 죄송합니다. 개인정보와 보안 관련 내용은 이 공간에 자세히 남기지 마시고 {contact}로 문의해 주시면 신속히 확인하겠습니다.`,
'칭찬·만족':v=>`따뜻한 후기를 남겨 주셔서 감사합니다! 만족스럽게 이용해 주신다니 큰 힘이 됩니다. 앞으로도 더 좋은 서비스로 보답하겠습니다.`,
'기타':v=>`소중한 의견 남겨 주셔서 감사합니다. 불편하셨던 점이 있다면 {contact}로 알려 주시면 확인해 드리겠습니다.`};

/* ============ 상태 ============ */
let S=null, UI={page:'inbox',sel:null,f:{store:'',status:'',voc:'',rating:'',q:'',risk:false},period:'monthly',pidx:0,qsel:{},qtab:'drafted',store:'googleplay'};
const META=window.REVIEW_DATA.meta;
const defaults=()=>({brand:'토스',contact:'앱 내 고객센터',tone:'정중',reviewer:'CS 담당자',autoDraft:true,prioLow:true,blockPII:true,escalate:true,syncEvery:'1d'});
function load(){
  const base=JSON.parse(JSON.stringify(window.REVIEW_DATA.reviews));let saved=null;
  try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  S={reviews:base,settings:Object.assign(defaults(),saved&&saved.settings||{}),log:(saved&&saved.log)||[]};
  const byId=new Map(base.map(r=>[r.id,r]));
  for(const[id,m]of Object.entries((saved&&saved.mods)||{})){const r=byId.get(id);if(r){r.status=m.status;r.reply=m.reply;r._d=1}}
}
function save(){try{const mods={};S.reviews.forEach(r=>{if(r._d)mods[r.id]={status:r.status,reply:r.reply}});localStorage.setItem(KEY,JSON.stringify({settings:S.settings,log:S.log,mods}))}catch(e){}}
const NOW=()=>new Date();

/* ============ 유틸 ============ */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stars=n=>'<span class="stars">'+'★'.repeat(n)+'<span style="color:#d6d9e3">'+'★'.repeat(5-n)+'</span></span>';
const fmtD=d=>{d=new Date(d);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const fmtMD=d=>`${d.getMonth()+1}/${d.getDate()}`;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const f1=n=>(Math.round(n*10)/10).toFixed(1);
const pct=(a,b)=>b?Math.round(a/b*100):0;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)}
function ageStr(d){return fmtD(d)}
const verS=r=>r.version?'v'+r.version:'버전 미상';
const stChip=r=>r.status==='new'&&r.replyKnown===false?'<span class="st skipped">이력 미확인</span>':'<span class="st '+r.status+'">'+STLABEL[r.status]+'</span>';
function mask(a){return a.length<=2?a[0]+'*':a.slice(0,1)+'*'.repeat(Math.max(1,a.length-2))+a.slice(-1)}

function genReply(r,s){
  const body=REPLY[r.voc](r.version).replaceAll('{contact}',s.contact);
  const g=s.tone==='따뜻'?`안녕하세요 고객님, 소중한 후기를 남겨 주셔서 감사합니다.`:s.tone==='간결'?`${s.brand}입니다.`:`안녕하세요, ${s.brand} 고객지원팀입니다.`;
  let t=`${g} ${body}`;
  if(s.tone==='간결')t=t.replace(/죄송합니다\. /,'죄송합니다. ');
  if(r.rating<=2&&r.voc!=='칭찬·만족'&&!/죄송/.test(t))t=t.replace(g,g+' 불편을 드려 죄송합니다.');
  return t;
}
function checks(r){
  const t=r.reply?.text||'',lim=LIMIT[r.store],errs=[],warns=[];
  if(t.length>lim)errs.push(`${STORE[r.store]} 글자 수 제한 초과 (${t.length}/${lim})`);
  if(S.settings.blockPII&&PII_RE.test(t))errs.push('답변에 전화번호/이메일로 보이는 정보가 있습니다');
  if(/환불해 드리|보상|무조건|100%|곧 출시|다음 업데이트에 반영/.test(t))warns.push('보상·일정 약속으로 읽힐 수 있는 표현이 있습니다');
  if(PII_RE.test(r.text))warns.push('리뷰 원문에 개인정보 패턴이 있습니다. 답변에 인용하지 마세요');
  const esc_=r.severity==='high'&&S.settings.escalate;
  return{errs,warns,needEsc:esc_,len:t.length,lim};
}

function draft(r,force){
  if(r.status==='published')return;
  if(r.status!=='new'&&!force)return;
  r.reply={text:genReply(r,S.settings),draftedAt:NOW().toISOString(),needsEscalation:r.severity==='high'};
  r.status='drafted';r._d=1;
}
function approve(r,ack){
  const c=checks(r);
  if(c.errs.length){toast('승인 불가: '+c.errs[0]);return false}
  if(c.needEsc&&!r.reply.escAck&&!ack){toast('고위험 리뷰입니다. 에스컬레이션 확인 체크가 필요합니다');return false}
  r._d=1;r.status='approved';r.reply.approvedBy=S.settings.reviewer;r.reply.approvedAt=NOW().toISOString();r.reply.approvedText=r.reply.text;return true;
}
function publish(r){
  if(r.status!=='approved'||!r.reply?.approvedBy||r.reply.approvedText!==r.reply.text){toast('승인되지 않았거나 승인 후 수정된 답변은 완료 처리할 수 없습니다');return false}
  r._d=1;r.status='published';r.reply.publishedAt=NOW().toISOString();S.log.push({ts:r.reply.publishedAt,id:r.id,store:r.store,result:'게시 완료 표시'});return true;
}

/* ---- 리뷰 분석 ---- */
const kstMs=(y,m,d)=>Date.UTC(y,m-1,d)-KST;
const lbl=ms=>{const d=new Date(ms+KST);return `${d.getUTCMonth()+1}/${d.getUTCDate()}`};
function windows(kind){
  const out=[];
  if(kind==='weekly'){const s=kstMs(2026,7,6);for(let i=0;i<12;i++)out.push({s:s+i*7*DAY,e:s+(i+1)*7*DAY});}
  else{[[7,8],[8,9],[9,10]].forEach(([m,n])=>out.push({s:kstMs(2026,m,1),e:kstMs(2026,n,1)}));}
  out.reverse().forEach((w,i)=>{w.i=i;w.short=kind==='weekly'?lbl(w.s):((new Date(w.s+KST)).getUTCMonth()+1)+'월';w.label=kind==='weekly'?`${lbl(w.s)}–${lbl(w.e-DAY)}`:w.short});
  return out}
function inWin(w){return S.reviews.filter(r=>{const t=+new Date(r.date);return t>=w.s&&t<w.e&&(!UI.store||r.store===UI.store)})}
function kpi(rs){
  const known=rs.filter(r=>r.replyKnown!==false),pub=known.filter(r=>r.reply?.publishedAt),neg=rs.filter(r=>r.rating<=2);
  const hrs=pub.map(r=>(new Date(r.reply.publishedAt)-new Date(r.date))/3600000);hrs.sort((a,b)=>a-b);
  return{n:rs.length,avg:avg(rs.map(r=>r.rating)),neg:neg.length,negRate:pct(neg.length,rs.length),resp:pct(pub.length,known.length),med:hrs.length?hrs[Math.floor(hrs.length/2)]:0};
}
function dcell(cur,prev,inv,suffix='',dec=0){
  if(prev===undefined||prev===null)return '';const d=cur-prev;if(Math.abs(d)<(dec?0.05:0.5))return `<span class="delta flat">변화 없음</span>`;
  const bad=inv?d<0:d>0;return `<span class="delta ${bad?'up':'dn'}">${d>0?'▲':'▼'} ${Math.abs(d).toFixed(dec)}${suffix}</span>`}
function vAnalysis(){
  const W=windows(UI.period);if(UI.pidx>=W.length)UI.pidx=0;
  const cw=W[UI.pidx],pw=W[UI.pidx+1],cr=inWin(cw),pr=pw?inWin(pw):[],k=kpi(cr),p=kpi(pr),hp=!!pw;
  const wk=UI.period==='weekly',unit=wk?'주':'월',tl=wk?'직전 주':'직전 월';
  /* VoC 분포 */
  const dist=VOC.map(v=>{const c=cr.filter(r=>r.voc===v),q=pr.filter(r=>r.voc===v);return{v,n:c.length,pn:q.length,avg:avg(c.map(r=>r.rating)),neg:c.filter(r=>r.rating<=2).length,sev:c.filter(r=>r.severity==='high').length}});
  const maxN=Math.max(1,...dist.map(d=>Math.max(d.n,d.pn)));
  /* 트렌드 */
  const series=W.slice().reverse().map(w=>{const rs=inWin(w);return{l:w.short,n:rs.length,a:avg(rs.map(r=>r.rating)),cur:w.i===UI.pidx}});
  /* 히트맵 */
  const hm=W.slice().reverse().map(w=>{const rs=inWin(w);return{l:w.short,tot:rs.length,by:Object.fromEntries(VOC.map(v=>[v,rs.filter(r=>r.voc===v).length]))}});
  /* 별점 분포, 스토어, 버전, 키워드 */
  const rd=[5,4,3,2,1].map(s=>({s,n:cr.filter(r=>r.rating===s).length}));
  const kw={};cr.filter(r=>r.rating<=3).forEach(r=>r.keywords.forEach(x=>kw[x]=(kw[x]||0)+1));
  const kws=Object.entries(kw).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const vers={};cr.forEach(r=>{const vk=r.version||'미상';(vers[vk]=vers[vk]||[]).push(r.rating)});
  const stores=['appstore','googleplay'].map(s=>{const x=cr.filter(r=>r.store===s);return{s,n:x.length,a:avg(x.map(r=>r.rating))}});
  const issues=topIssues(cr,pr);

function vocDelta(d){
  if(Math.max(d.n,d.pn)<5)return '<span class="meta">표본 적음</span>';
  if(d.pn<3){const up=d.v!=='칭찬·만족';return `<span class="delta ${up?'up':'dn'}">▲ +${d.n-d.pn}건</span>`}
  const ch=Math.round((d.n-d.pn)/d.pn*100);if(Math.abs(ch)<10)return '<span class="delta flat">비슷</span>';
  const good=d.v==='칭찬·만족'?ch>0:ch<0;return `<span class="delta ${good?'dn':'up'}">${ch>0?'▲':'▼'} ${Math.abs(ch)}%</span>`;
}
function trendSvg(s){
  const W=640,H=200,pl=30,pr=30,pt=14,pb=34,n=s.length,bw=(W-pl-pr)/n,mx=Math.max(1,...s.map(x=>x.n))*1.15;
  const y=v=>pt+(H-pt-pb)*(1-v/mx),ya=v=>pt+(H-pt-pb)*(1-(v-1)/4);
  let b='',pts=[];
  s.forEach((x,i)=>{const cx=pl+bw*i+bw/2;b+=`<rect x="${cx-bw*.3}" y="${y(x.n)}" width="${bw*.6}" height="${H-pb-y(x.n)}" rx="3" fill="${x.cur?'#4f46e5':'#c7cbe6'}"/><text x="${cx}" y="${H-pb-5}" font-size="10" text-anchor="middle" fill="${x.cur?'#fff':'#394056'}">${x.n}</text><text x="${cx}" y="${H-pb+14}" font-size="9.5" text-anchor="middle" fill="#6b7385">${x.l}</text>`;pts.push([cx,ya(x.a),x.a])});
  const line=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="#e4e7ee"/>${b}<path d="${line}" fill="none" stroke="#f59e0b" stroke-width="2"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#f59e0b"/><text x="${p[0]}" y="${p[1]-7}" font-size="10" text-anchor="middle" fill="#b45309" style="paint-order:stroke;stroke:#fff;stroke-width:3px">${f1(p[2])}</text>`).join('')}</svg><div class="meta"><span style="color:#4f46e5">■</span> 리뷰 수 <span style="color:#f59e0b">●</span> 평균 평점</div>`;
}
function topIssues(cr,pr){
  const out=[];
  VOC.filter(v=>!['칭찬·만족','기능 요청','기타'].includes(v)).forEach(v=>{
    const c=cr.filter(r=>r.voc===v&&r.rating<=3),q=pr.filter(r=>r.voc===v&&r.rating<=3);if(c.length<3)return;
    const g=q.length?(c.length-q.length)/q.length:1,w=c.some(r=>r.severity==='high')?2:c.some(r=>r.severity==='mid')?1.3:1;
    out.push({v,c,q,g,score:c.length*(1+Math.max(g,0))*w,small:c.length<10});
  });
  return out.sort((a,b)=>b.score-a.score).slice(0,3);
}
function impact(is,cr){const all=cr.map(r=>r.rating),ids=new Set(is.c.map(r=>r.id)),after=cr.map(r=>ids.has(r.id)&&r.rating<4?4:r.rating);return avg(after)-avg(all)}
function issueData(is,i){
  const{cw,pw,k}=window.__report,cr=inWin(cw);
  const vers={};is.c.forEach(r=>{const vk=r.version||'미상';vers[vk]=(vers[vk]||0)+1});const topV=Object.entries(vers).sort((a,b)=>b[1]-a[1])[0];
  const st={appstore:is.c.filter(r=>r.store==='appstore').length,googleplay:is.c.filter(r=>r.store==='googleplay').length};
  const kw={};is.c.forEach(r=>r.keywords.forEach(x=>kw[x]=(kw[x]||0)+1));
  const quotes=is.c.slice().sort((a,b)=>b.text.length-a.text.length).slice(0,2).map(r=>`${'★'.repeat(r.rating)} "${r.text}" (${r.author}, ${STORE[r.store]}, ${verS(r)})`);
  const head=is.q.length?`${is.v} 관련 불만 ${is.q.length}건 → ${is.c.length}건 (${is.g>0?'+':''}${Math.round(is.g*100)}%)`:`${is.v} 관련 불만 ${is.c.length}건 (직전 기간 없음)`;
  return{rank:i+1,v:is.v,head,n:is.c.length,avg:avg(is.c.map(r=>r.rating)),topV,st,kws:Object.entries(kw).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]),quotes,team:ACTION[is.v][0],act:ACTION[is.v][1],imp:impact(is,cr),share:pct(is.c.length,k.n),small:is.small,high:is.c.filter(r=>r.severity==='high').length};
}
function issueHtml(is,i){
  const d=issueData(is,i);
  return `<div class="issue" style="border-left-color:${VCOL[d.v]}"><h4>${d.rank}. ${esc(d.head)}</h4>
  <div class="meta">전체 리뷰의 ${d.share}% · 평균 ${f1(d.avg)}점 · 가장 많이 언급된 버전 ${d.topV?(d.topV[0]==='미상'?'미상':'v'+d.topV[0])+' ('+d.topV[1]+'건)':'-'} · App Store ${d.st.appstore} / Google Play ${d.st.googleplay}${d.high?` · 고위험 ${d.high}건`:''}${d.small?' · 표본 적음(n<10)':''}</div>

}
function reportMd(){
  const{cw,pw,k,p,hp,issues,tl}=window.__report;
  let m=`# 토스 앱 리뷰 VoC 리포트 (${cw.label})\n\n대상: ${UI.store?STORE[UI.store]:'전체 스토어'} · 비교 기간: ${hp?pw.label+' ('+tl+')':'없음'}\n\n## 핵심 지표\n| 지표 | 이번 | 비교 | \n|---|---|---|\n| 리뷰 수 | ${k.n} | ${hp?p.n:'-'} |\n| 평균 평점 | ${f1(k.avg)} | ${hp?f1(p.avg):'-'} |\n| 부정(1~2점) 비율 | ${k.negRate}% | ${hp?p.negRate+'%':'-'} |\n| 답변율(Google Play) | ${k.resp}% | ${hp?p.resp+'%':'-'} |\n\n## 제품팀 전달 이슈 TOP${issues.length}\n`;
  issues.forEach((is,i)=>{const d=issueData(is,i);m+=`\n### ${d.rank}. ${d.head}\n- 전체 리뷰의 ${d.share}%, 평균 ${f1(d.avg)}점, 최다 버전 ${d.topV?(d.topV[0]==='미상'?'미상':'v'+d.topV[0]):'-'}, 키워드: ${d.kws.join(', ')}\n${d.quotes.map(q=>`- 인용: ${q}`).join('\n')}\n- 제안(${d.team}): ${d.act}\n- 예상 효과(가정): 평균 평점 +${d.imp.toFixed(2)}${d.small?'\n- 주의: 표본 적음':''}\n`});
  return m;
}

function dl(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([typeof obj==='string'?obj:JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click()}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-nav],[data-sel],[data-act],[data-quick],[data-qtab],[data-per],[data-open]');if(!t)return;
  const d=t.dataset,R=id=>S.reviews.find(r=>r.id===id);
  if(d.nav){UI.page=d.nav;render();return}
  if(d.sel){UI.sel=d.sel;render();return}
  if(d.open){UI.page='inbox';UI.f={store:'',status:'',voc:'',rating:'',q:'',risk:false};UI.sel=d.open;render();return}
  if(d.quick){UI.f={store:d.quick==='unk'?'appstore':'',status:d.quick==='risk'?'':d.quick==='unk'?'new':d.quick,voc:'',rating:'',q:'',risk:d.quick==='risk'};render();return}
  if(d.qtab){UI.qtab=d.qtab;UI.qsel={};render();return}
  if(d.per){UI.period=d.per;UI.pidx=0;render();return}
  switch(d.act){
        case 'clearF':UI.f={store:'',status:'',voc:'',rating:'',q:'',risk:false};render();break;
    case 'draftAll':{const rs=S.reviews.filter(r=>r.status==='new'&&r.replyKnown!==false);rs.forEach(r=>draft(r));save();toast(`${rs.length}건 초안 생성 완료. 승인 대기에서 검토하세요`);render();break}
    case 'draft':case 'regen':{const r=R(d.id);draft(r,true);r.reply.escAck=false;save();render();break}
    case 'approve':{const r=R(d.id);if(approve(r)){save();toast('승인했습니다. 이제 게시할 수 있습니다')}render();break}
    case 'publish':{const r=R(d.id);if(confirm('스토어 콘솔에 직접 게시를 마쳤나요?\n(이 화면은 스토어로 전송하지 않고 완료 상태만 기록합니다)')&&publish(r)){save();toast('게시 완료로 표시했습니다')}render();break}
    case 'copy':{const r=R(d.id);navigator.clipboard.writeText(r.reply.text).then(()=>toast('답변을 복사했습니다'),()=>toast('복사에 실패했습니다'));break}
    case 'skip':{const r=R(d.id);r.status='skipped';r._d=1;save();render();break}
    case 'selAll':{S.reviews.filter(r=>r.status==='drafted').forEach(r=>{const c=checks(r);if(!(c.needEsc&&!r.reply.escAck)&&!c.errs.length)UI.qsel[r.id]=true});render();break}
    case 'bulkApprove':{let ok=0;Object.keys(UI.qsel).filter(i=>UI.qsel[i]).forEach(i=>{if(approve(R(i)))ok++});UI.qsel={};save();toast(`${ok}건 승인`);render();break}
    case 'bulkPublish':{if(!confirm('승인된 답변을 모두 스토어 콘솔에 게시했나요? 완료 상태로 기록합니다.'))break;let ok=0;S.reviews.filter(r=>r.status==='approved').forEach(r=>{if(publish(r))ok++});save();toast(`${ok}건 게시 완료로 표시`);render();break}
    case 'exportQ':dl('approved_queue.json',S.reviews.filter(r=>r.status==='approved').map(r=>({id:r.id,store:r.store,replyText:r.reply.approvedText,approvedBy:r.reply.approvedBy,approvedAt:r.reply.approvedAt,needsEscalation:!!r.reply.needsEscalation,escalationAckBy:r.reply.escAck?r.reply.approvedBy:null})));break;
    case 'exportAll':dl('reviews.json',S.reviews);break;
    case 'reset':if(confirm('이 브라우저에 저장된 초안·승인 기록을 모두 지울까요?')){localStorage.removeItem(KEY);load();UI.sel=null;render()}break;
    case 'copyMd':navigator.clipboard.writeText(reportMd()).then(()=>toast('마크다운을 복사했습니다'),()=>toast('복사에 실패했습니다'));break;
    case 'print':window.print();break;
  }
});

  if(d.sv){S.settings[d.sv]=t.value;save();toast('저장했습니다');return}
  if(d.q){UI.qsel[d.q]=t.checked;render();return}
  if(d.esc){const r=S.reviews.find(x=>x.id===d.esc);r.reply.escAck=t.checked;r._d=1;save();render();return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='fq'){UI.f.q=t.value;const p=t.selectionStart;render();const n=document.getElementById('fq');n.focus();n.setSelectionRange(p,p);return}
  if(t.dataset.reply){const r=S.reviews.find(x=>x.id===t.dataset.reply);r.reply.text=t.value;r._d=1;save();const c=checks(r);document.getElementById('cnt_'+r.id).textContent=`${c.len}/${c.lim}자 (${STORE[r.store]})`}
});
load();render();
</script>
</body>
</html>
