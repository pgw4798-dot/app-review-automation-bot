<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리뷰 답변 콘솔 · 토스 앱 리뷰</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/*
  디자인 메모
  - 방향: 금융 CS 운영 도구. 조용한 흰 바탕에 파란 액션 색 하나, 위험은 붉은색만 사용.
  - 타입: Pretendard 한 가족. 숫자는 tabular-nums. 큰 글씨는 분석 화면의 한 문장 헤드라인에만 쓴다.
  - 구조: 카드를 쪼개 쌓지 않고 큰 시트 + 가는 구분선. 모서리 반경은 8(컨트롤)/14(시트) 두 단계만.
  - 눈에 띄는 한 곳: 답변 작성 영역의 "비슷한 사례" 근거 목록.
*/
:root{
  --ink:#191f28;--text2:#4e5968;--text3:#8b95a1;--line:#e5e8eb;--line2:#f2f4f6;--bg:#f2f4f6;--sheet:#fff;
  --accent:#3182f6;--accent-d:#1b64da;--accent-s:#e8f3ff;
  --danger:#f04452;--danger-s:#ffebee;--warn:#d9730d;--warn-s:#fff3e0;--ok:#0e9f6e;--ok-s:#e6f7ef;
  --r1:8px;--r2:14px;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:400 14px/1.6 var(--font);color:var(--ink);background:var(--bg);display:flex;min-height:100vh;font-variant-numeric:tabular-nums;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
aside{width:232px;background:var(--sheet);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column}
.brand{padding:0 10px 22px}
.brand b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}
.brand span{font-size:12.5px;color:var(--text3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:10px;border-radius:var(--r1);cursor:pointer;text-align:left;color:var(--text2);font-weight:500}
.nav button:hover{background:var(--line2)}
.nav button.on{background:var(--accent-s);color:var(--accent-d);font-weight:700}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;font-size:12.5px;color:var(--text3);font-weight:500}
.nav button.on .cnt{color:var(--accent-d)}
.who{margin-top:auto;padding:10px;font-size:12.5px;color:var(--text3);border-top:1px solid var(--line)}
.who b{display:block;color:var(--ink);font-weight:600}
main{flex:1;min-width:0;padding:28px 32px 72px;max-width:1480px}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-h h2{font-size:22px;font-weight:700}
.page-h p{margin:2px 0 0;color:var(--text3)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r2)}
.pad{padding:20px 22px}
.sec{padding:20px 22px;border-top:1px solid var(--line2)}
.sec:first-child{border-top:0}
.sec h3{font-size:15px;font-weight:700;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{margin-left:auto}
.mute{color:var(--text3);font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:var(--r1);padding:7px 13px;cursor:pointer;font-weight:600;color:var(--text2);transition:background .12s,border-color .12s}
.btn:hover{background:var(--line2)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}.btn.p:hover{background:var(--accent-d)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
select,input[type=text],input[type=search],textarea{border:1px solid var(--line);border-radius:var(--r1);padding:7px 10px;background:#fff}
select{padding-right:6px}
textarea{width:100%;resize:vertical;min-height:112px;line-height:1.7;max-width:74ch}
textarea[readonly]{background:var(--line2)}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;vertical-align:-2px}
/* 상단 현황 */
.strip{display:grid;grid-template-columns:repeat(5,1fr);margin-bottom:14px}
.strip button{background:none;border:0;border-left:1px solid var(--line2);text-align:left;padding:16px 22px;cursor:pointer}
.strip button:first-child{border-left:0}
.strip button:hover{background:#fafbfc}
.strip .n{font-size:26px;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.strip .l{font-size:13px;color:var(--text3)}
.n.bad{color:var(--danger)}.n.warn{color:var(--warn)}.n.acc{color:var(--accent-d)}
/* 수신함 */
.split{display:grid;grid-template-columns:minmax(340px,440px) 1fr;gap:14px;align-items:start}
.list{max-height:calc(100vh - 290px);overflow:auto}
.item{padding:14px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-left:3px solid transparent}
.item:hover{background:#fafbfc}
.item.sel{background:var(--accent-s);border-left-color:var(--accent)}
.item .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:6px 0 4px}
.rb{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:6px;font-weight:700;font-size:13px;padding:0 6px}
.rb.lo{background:var(--danger-s);color:var(--danger)}.rb.mid{background:var(--line2);color:var(--text2)}.rb.hi{background:var(--ok-s);color:var(--ok)}
.tag{display:inline-block;font-size:12.5px;border-radius:6px;padding:1px 8px;background:var(--line2);color:var(--text2);white-space:nowrap}
.tag.voc{background:var(--ink);color:#fff;font-weight:600}
.tag.risk{background:var(--danger-s);color:var(--danger);font-weight:700}
.tag.st-new{background:var(--danger-s);color:var(--danger);font-weight:600}
.tag.st-drafted{background:var(--warn-s);color:var(--warn);font-weight:600}
.tag.st-approved{background:var(--accent-s);color:var(--accent-d);font-weight:600}
.tag.st-published{background:var(--ok-s);color:var(--ok);font-weight:600}
.tag.st-skipped,.tag.st-unk{background:var(--line2);color:var(--text3)}
.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--text3);font-size:12.5px;align-items:center}
.review-text{font-size:16px;line-height:1.75;margin:14px 0 12px;max-width:74ch;white-space:pre-wrap}
/* 단계 */
.steps{display:flex;gap:0;margin:2px 0 16px}
.steps div{flex:1;position:relative;padding-top:18px;font-size:12.5px;color:var(--text3)}
.steps div::before{content:"";position:absolute;top:5px;left:0;right:0;height:2px;background:var(--line)}
.steps div::after{content:"";position:absolute;top:0;left:0;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.steps div.done{color:var(--text2)}.steps div.done::before{background:var(--accent)}.steps div.done::after{background:var(--accent);border-color:var(--accent)}
.steps div.cur{color:var(--accent-d);font-weight:700}.steps div.cur::after{border-color:var(--accent)}
.steps div:last-child::before{right:60%}
/* 알림 박스 */
.note{border-radius:var(--r1);padding:10px 13px;margin:10px 0;font-size:13px;max-width:74ch}
.note.err{background:var(--danger-s);color:#b3202e}.note.warn{background:var(--warn-s);color:#8a4a07}.note.ok{background:var(--ok-s);color:#0b6b4a}.note.info{background:var(--accent-s);color:var(--accent-d)}
.banner{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:12px 18px;margin-bottom:16px;color:var(--text2);font-size:13px}
/* 근거 사례 */
.ev{margin-top:18px;border-top:1px solid var(--line2);padding-top:16px}
.ev h4{font-size:14px;font-weight:700;margin-bottom:2px}
.case{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:14px 0;border-top:1px solid var(--line2)}
.case .lab{font-size:12.5px;color:var(--text3);margin-bottom:3px;display:flex;gap:8px;align-items:center}
.case p{margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;line-height:1.65}
.sim{display:inline-block;width:46px;height:5px;border-radius:3px;background:var(--line);vertical-align:middle;overflow:hidden}
.sim i{display:block;height:100%;background:var(--accent)}
.pick{color:var(--accent-d);font-weight:700}
/* 표 */
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:12.5px;color:var(--text3);font-weight:600}
/* 분석 */
.lead-h{font-size:28px;font-weight:700;line-height:1.35;letter-spacing:-.03em;max-width:30ch;margin:0 0 6px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr)}
.kpis>div{padding:16px 22px;border-left:1px solid var(--line2)}.kpis>div:first-child{border-left:0}
.kpis .v{font-size:24px;font-weight:700;letter-spacing:-.02em}
.d-up{color:var(--danger);font-weight:600}.d-dn{color:var(--ok);font-weight:600}.d-flat{color:var(--text3)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px;margin-top:14px;align-items:start}
.bar{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.vrow{display:grid;grid-template-columns:104px 1fr 96px;gap:12px;align-items:center;padding:7px 0}
.hm td{text-align:center;padding:6px 4px;font-size:12.5px;border:1px solid #fff}
.issue{padding:16px 0;border-top:1px solid var(--line2)}
.issue h4{font-size:16px;font-weight:700;margin-bottom:4px}
.quote{border-left:3px solid var(--line);padding:1px 12px;color:var(--text2);margin:6px 0;font-size:13.5px;max-width:80ch}
.sw{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line2)}
.sw .d{color:var(--text3);font-size:12.5px}
.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--r1);opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:360px}
.toast.show{opacity:1}
@media(max-width:1000px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;align-items:center;gap:8px;padding:10px 14px;overflow-x:auto}.brand{padding:0 10px 0 0}.nav{flex-direction:row}.who{display:none}.split{grid-template-columns:1fr}.list{max-height:none}main{padding:18px 16px 56px}.strip,.kpis{grid-template-columns:repeat(2,1fr)}.case{grid-template-columns:1fr}.lead-h{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{aside,.noprint{display:none!important}main{padding:0}body{background:#fff}.sheet{border:0}}
</style>
</head>
<body>
<aside>
  <div class="brand"><b>리뷰 답변 콘솔</b><span id="brandSub"></span></div>
  <nav class="nav" id="nav" aria-label="메뉴"></nav>
  <div class="who"><b id="whoName"></b>CS 담당자</div>
</aside>
<main id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data/toss-reviews.js"></script>
<script>
/* ============ 상수 ============ */
const VOC=['버그·오류','성능·속도','로그인·인증','송금·결제','UX·사용성','기능 요청','고객지원·응대','수수료·금리','증권·투자','광고·리워드','보안·사기','칭찬·만족','기타'];
const STLABEL={new:'미답변',drafted:'초안 완료',approved:'승인됨',published:'게시 완료',skipped:'제외'};
const LIMIT={googleplay:350,appstore:700};
const STORE={appstore:'App Store',googleplay:'Google Play'};
const DAY=86400000,KST=9*3600000,KEY='rvbot_toss_v2';
const PII_RE=/(01[016789][- .]?\d{3,4}[- .]?\d{4})|([\w.+-]+@[\w-]+\.[\w.]+)/;
const ICON={
 inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
 reply:'<path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/>',
 analysis:'<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
 settings:'<line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const ACTION={
'버그·오류':['개발 · QA','재현 조건 수집 후 크래시·오류 로그와 리뷰 버전 매칭, 핫픽스 우선순위 검토'],
'성능·속도':['개발 · 인프라','주요 화면 로딩 지표(P95)와 배터리·발열 회귀 여부 점검'],
'로그인·인증':['개발 · 보안 · PM','본인/얼굴 인증 요청 빈도와 이탈 구간 점검, 인증 유도 노출 정책 재검토'],
'송금·결제':['결제 · 개발 · CS','송금·결제·충전 실패와 중복 처리 로그 점검, 점검 공지 방식 개선'],
'UX·사용성':['디자인 · PM','최근 개편 화면의 이탈·문의 지표 비교, 변경 전 기능(예: 소비 내역 보기) 복원 여부 검토'],
'기능 요청':['PM','요청 빈도 기준 백로그 등록 및 로드맵 검토'],
'고객지원·응대':['CS 운영','상담 연결 시간·응대 SLA 점검, 인입 증가 시간대 인력 배치, 셀프 해결 안내 보강'],
'수수료·금리':['사업 · 금융 PM','수수료·금리·한도 안내 방식 점검, 민감 세그먼트 분석'],
'증권·투자':['증권 개발 · PM','호가창·차트·시세 표시 오류와 지연 점검, 장 시작/마감 시간대 부하 확인'],
'광고·리워드':['그로스 · 광고 · PM','광고 노출 빈도와 리워드 지급 오류 점검, 광고 종료 버튼/지급 로직 확인'],
'보안·사기':['보안 · 법무 · CS','개인정보·사기 언급 건 개별 확인, 안내 문구 점검(고위험으로 별도 에스컬레이션)'],
'칭찬·만족':['PM · 마케팅','강점 키워드를 스토어 설명과 마케팅 문구에 반영'],
'기타':['CS 운영','분류 불가 리뷰 표본 점검 후 분류 규칙 보강']};
/* 유사 사례가 전혀 없을 때만 쓰는 최소 폴백 */
const FALLBACK='안녕하세요. 고객님, 토스팀입니다. 소중한 의견 남겨 주셔서 감사합니다. 불편하셨던 점은 담당 부서에 전달하겠습니다. 추가 문의가 있으시면 앱 내 고객센터로 알려 주세요.';

/* ============ 상태 ============ */
let S=null,UI={page:'inbox',sel:null,f:{store:'',status:'',voc:'',rating:'',q:'',risk:false},period:'monthly',pidx:0,qsel:{},qtab:'drafted',store:'googleplay'};
const META=window.REVIEW_DATA.meta;
const defaults=()=>({reviewer:'CS 담당자',autoDraft:true,prioLow:true,blockPII:true,escalate:true,syncEvery:'1d'});
function load(){
  const base=JSON.parse(JSON.stringify(window.REVIEW_DATA.reviews));let saved=null;
  try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  S={reviews:base,settings:Object.assign(defaults(),saved&&saved.settings||{}),log:(saved&&saved.log)||[]};
  const byId=new Map(base.map(r=>[r.id,r]));
  for(const[id,m]of Object.entries((saved&&saved.mods)||{})){const r=byId.get(id);if(r){r.status=m.status;r.reply=m.reply;r._d=1}}
  S.byId=byId;
}
function save(){try{const mods={};S.reviews.forEach(r=>{if(r._d)mods[r.id]={status:r.status,reply:r.reply}});localStorage.setItem(KEY,JSON.stringify({settings:S.settings,log:S.log,mods}))}catch(e){}}
const NOW=()=>new Date();

/* ============ 유틸 ============ */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rb=n=>`<span class="rb ${n>=4?'hi':n===3?'mid':'lo'}" aria-label="${n}점">${n}</span>`;
const fmtD=d=>{d=new Date(d);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const f1=n=>(Math.round(n*10)/10).toFixed(1);
const pct=(a,b)=>b?Math.round(a/b*100):0;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2400)}
const verS=r=>r.version?'v'+r.version:'버전 미상';
const stTag=r=>r.status==='new'&&r.replyKnown===false?'<span class="tag st-unk">답변 이력 미확인</span>':`<span class="tag st-${r.status}">${STLABEL[r.status]}</span>`;

/* ============ 유사 사례 검색 (토스 실제 답변 기반) ============
   토스 운영팀이 스토어에 실제로 남긴 답변이 있는 리뷰를 색인(문자 2-gram TF-IDF)하고,
   새 리뷰와 가장 비슷한 사례 k개의 답변 중 서로 가장 일치하는 답변을 초안으로 고른다. */
let RX=null;
const gram=t=>{const s=(t||'').replace(/\s+/g,' ').toLowerCase(),m=new Map();for(let i=0;i<s.length-1;i++){const g=s.slice(i,i+2);m.set(g,(m.get(g)||0)+1)}return m};
function mkIdx(grams){
  const df=new Map();grams.forEach(v=>v.forEach((_,g)=>df.set(g,(df.get(g)||0)+1)));const N=grams.length;
  const idf=g=>Math.log(1+N/(1+(df.get(g)||0)));
  const nv=v=>{let s=0;const w=new Map();v.forEach((c,g)=>{const x=(1+Math.log(c))*idf(g);w.set(g,x);s+=x*x});return{w,n:Math.sqrt(s)||1}};
  return{nv,vecs:grams.map(nv)};
}
const cosv=(a,b)=>{let s=0;const[x,y]=a.w.size<b.w.size?[a,b]:[b,a];x.w.forEach((v,g)=>{const o=y.w.get(g);if(o)s+=v*o});return s/(a.n*b.n)};
const bucket=r=>r<=2?0:r===3?1:2;
function buildRX(){
  const docs=S.reviews.filter(r=>r.reply&&r.reply.source==='store'&&r.reply.text);
  RX={docs,q:mkIdx(docs.map(d=>gram(d.text))),a:null};
  RX.a=mkIdx(docs.map(d=>gram(d.reply.text)));
}
function suggest(r,k=8){
  if(!RX)buildRX();
  const q=RX.q.nv(gram(r.text)),lim=LIMIT[r.store];
  const sc=[];
  RX.docs.forEach((d,i)=>{
    if(d.id===r.id||d.reply.text.length>lim||PII_RE.test(d.reply.text))return;
    sc.push({i,d,s:cosv(q,RX.q.vecs[i])*(bucket(d.rating)===bucket(r.rating)?1:0.8)});
  });
  sc.sort((a,b)=>b.s-a.s);const top=sc.slice(0,k);
  if(!top.length)return null;
  let best=null,bs=-1;
  top.forEach((a,x)=>{let t=a.s;top.forEach((b,y)=>{if(x!==y)t+=b.s*cosv(RX.a.vecs[a.i],RX.a.vecs[b.i])});if(t>bs){bs=t;best=a}});
  const cases=[best,...top.filter(x=>x!==best)].slice(0,3).map(x=>({id:x.d.id,sim:Math.round(x.s*100)/100}));
  return{text:best.d.reply.text,top1:top[0].s,cases,chosen:best.d.id};
}
const simLevel=s=>s>=.45?'높음':s>=.25?'보통':'낮음';

function checks(r){
  const t=r.reply?.text||'',lim=LIMIT[r.store],errs=[],warns=[];
  if(t.length>lim)errs.push(`${STORE[r.store]} 글자 수 제한 초과 (${t.length}/${lim})`);
  if(S.settings.blockPII&&PII_RE.test(t))errs.push('답변에 전화번호/이메일로 보이는 정보가 있습니다');
  if(/환불해 드리|보상|무조건|100%|곧 출시|다음 업데이트에 반영/.test(t))warns.push('보상·일정 약속으로 읽힐 수 있는 표현이 있습니다');
  if(PII_RE.test(r.text))warns.push('리뷰 원문에 개인정보 패턴이 있습니다. 답변에 인용하지 마세요');
  return{errs,warns,needEsc:r.severity==='high'&&S.settings.escalate,len:t.length,lim};
}
function draft(r,force){
  if(r.status==='published')return;
  if(r.status!=='new'&&!force)return;
  const sg=suggest(r);
  r.reply={text:sg?sg.text:FALLBACK,draftedAt:NOW().toISOString(),needsEscalation:r.severity==='high',basis:sg?{method:'retrieval',top1:Math.round(sg.top1*100)/100,cases:sg.cases,chosen:sg.chosen}:{method:'fallback',cases:[]}};
  r.status='drafted';r._d=1;
}
function approve(r){
  const c=checks(r);
  if(c.errs.length){toast('승인할 수 없습니다. '+c.errs[0]);return false}
  if(c.needEsc&&!r.reply.escAck){toast('고위험 리뷰입니다. 에스컬레이션 확인이 먼저 필요합니다');return false}
  r._d=1;r.status='approved';r.reply.approvedBy=S.settings.reviewer;r.reply.approvedAt=NOW().toISOString();r.reply.approvedText=r.reply.text;return true;
}
function publish(r){
  if(r.status!=='approved'||!r.reply?.approvedBy||r.reply.approvedText!==r.reply.text){toast('승인 후 수정된 답변은 다시 승인해야 합니다');return false}
  r._d=1;r.status='published';r.reply.publishedAt=NOW().toISOString();S.log.push({ts:r.reply.publishedAt,id:r.id,store:r.store,result:'게시 완료 표시'});return true;
}

  if(S.settings.prioLow&&a.status==='new'&&b.status==='new'){const p=x=>(x.severity==='high'?0:x.rating<=2?1:2);if(p(a)!==p(b))return p(a)-p(b)}
  return new Date(b.date)-new Date(a.date)})}

function itemHtml(r){return `<div class="item ${r.id===UI.sel?'sel':''}" data-sel="${r.id}" role="listitem" tabindex="0"><div class="row" style="gap:8px">${rb(r.rating)}${stTag(r)}${r.severity==='high'?'<span class="tag risk">고위험</span>':''}<span class="mute sp">${fmtD(r.date)}</span></div><div class="t">${esc(r.text)}</div><div class="meta"><span>${STORE[r.store]}</span><span>${verS(r)}</span><span>${r.voc}</span></div></div>`}
function detailHtml(r){
  if(!r)return '<div class="pad mute">왼쪽에서 리뷰를 선택하세요.</div>';
  return `<div class="sec"><div class="row">${rb(r.rating)}<b>${esc(r.author)}</b><span class="meta"><span>${STORE[r.store]}</span><span>${verS(r)}</span><span>${esc(r.device)}</span><span>${fmtD(r.date)}</span></span><span class="sp">${stTag(r)}</span></div>
  <p class="review-text">${esc(r.text)}</p>
  <div class="row" style="gap:6px"><span class="tag voc">${r.voc}</span>${r.keywords.map(k=>`<span class="tag">${esc(k)}</span>`).join('')}${r.severity==='high'?'<span class="tag risk">고위험 에스컬레이션 대상</span>':''}</div></div>
  <div class="sec">${replyBox(r)}</div>`;
}
function stepsHtml(r){const o=['new','drafted','approved','published'],i=Math.max(0,o.indexOf(r.status));return `<div class="steps">${['수집','AI 초안','담당자 승인','게시 완료'].map((l,k)=>`<div class="${k<i?'done':k===i?'cur':''}">${l}</div>`).join('')}</div>`}
function evidenceHtml(r){
  const b=r.reply&&r.reply.basis;if(!b||!b.cases||!b.cases.length)return '';
  const lv=b.top1!==undefined?simLevel(b.top1):'';
  const lowNote=lv==='낮음'?`<div class="note warn">비슷한 사례가 많지 않아 토스가 비슷한 불만에 가장 자주 쓴 형태의 답변을 골랐습니다. 이 리뷰의 상황에 맞는지 확인하고 고쳐 주세요.</div>`:'';
  return `<div class="ev"><h4>비슷한 사례에서 토스가 실제로 남긴 답변</h4><div class="mute">유사도 ${lv} (가장 비슷한 사례 ${Math.round((b.top1||0)*100)}%). 아래 답변 중 마음에 드는 것을 골라 쓸 수 있습니다.</div>${lowNote}
  ${b.cases.map(cs=>{const d=S.byId.get(cs.id);if(!d||!d.reply)return '';return `<div class="case"><div><div class="lab"><span class="sim"><i style="width:${Math.min(100,Math.round(cs.sim*200))}%"></i></span>리뷰 ${rb(d.rating)} ${cs.id===b.chosen?'<span class="pick">초안으로 선택됨</span>':''}</div><p>${esc(d.text)}</p></div>
  <div><div class="lab">토스 운영팀 답변 ${r.status!=='published'&&r.status!=='approved'?`<button class="btn sm" data-act="useCase" data-id="${r.id}" data-case="${d.id}">이 답변 사용</button>`:''}</div><p>${esc(d.reply.text)}</p></div></div>`}).join('')}</div>`;
}
function replyBox(r){
  let h=`<h3>답변</h3>${stepsHtml(r)}`;
  if(r.status==='new'){
    return h+`<p class="mute" style="margin:0 0 12px">${r.replyKnown===false?'App Store는 답변 이력을 알 수 없습니다. 필요하면 초안을 만들 수 있습니다.':'아직 초안이 없습니다.'}</p><button class="btn p" data-act="draft" data-id="${r.id}">초안 만들기</button>`}
  const c=checks(r),ro=r.status==='published'||r.status==='skipped';
  if(r.status==='skipped')return h+`<p class="mute">답변하지 않기로 한 리뷰입니다.</p>`;
  h+=r.reply.source==='store'?`<div class="mute" style="margin-bottom:6px">토스 운영팀이 스토어에 남긴 답변 (${fmtD(r.reply.publishedAt)})</div>`:'';
  h+=`<textarea data-reply="${r.id}" ${ro?'readonly':''} aria-label="답변 내용">${esc(r.reply.text)}</textarea><div class="mute" id="cnt_${r.id}" style="margin-top:4px">${c.len}/${c.lim}자 (${STORE[r.store]} 한도)</div>`;
  c.errs.forEach(e=>h+=`<div class="note err">${esc(e)}</div>`);c.warns.forEach(e=>h+=`<div class="note warn">${esc(e)}</div>`);
  if(c.needEsc&&!ro)h+=`<div class="note warn"><label><input type="checkbox" data-esc="${r.id}" ${r.reply.escAck?'checked':''}> 고위험 리뷰입니다. 내부 에스컬레이션(CS 리더, 법무, 보안)을 확인했습니다.</label></div>`;
  if(r.status==='approved'&&r.reply.approvedText!==r.reply.text)h+=`<div class="note err">승인 후 내용이 바뀌었습니다. 다시 승인해야 게시 완료로 표시할 수 있습니다.</div>`;
  if(r.reply.approvedBy&&r.reply.source!=='store')h+=`<div class="note ok">${esc(r.reply.approvedBy)}가 ${fmtD(r.reply.approvedAt)}에 승인했습니다.${r.reply.publishedAt?` ${fmtD(r.reply.publishedAt)}에 게시 완료로 표시했습니다.`:''}</div>`;
  if(!ro){
    h+=`<div class="row noprint" style="margin-top:12px"><button class="btn" data-act="regen" data-id="${r.id}">초안 다시 만들기</button>`+
    (r.status==='drafted'||(r.status==='approved'&&r.reply.approvedText!==r.reply.text)?`<button class="btn p" data-act="approve" data-id="${r.id}">승인</button>`:'')+
    (r.status==='approved'&&r.reply.approvedText===r.reply.text?`<button class="btn" data-act="copy" data-id="${r.id}">답변 복사</button><button class="btn p" data-act="publish" data-id="${r.id}">게시 완료로 표시</button>`:'')+
    `<button class="btn" data-act="skip" data-id="${r.id}">답변하지 않음</button></div>
    <p class="mute" style="margin-top:10px">승인 전에는 게시 완료로 표시할 수 없습니다. 스토어 연동은 보류 중이라, 승인한 답변을 복사해 스토어 콘솔에 직접 게시한 뒤 완료로 표시해 주세요.</p>`;
    h+=evidenceHtml(r);
  }
  return h;
}

const kstMs=(y,m,d)=>Date.UTC(y,m-1,d)-KST;
const lbl=ms=>{const d=new Date(ms+KST);return `${d.getUTCMonth()+1}/${d.getUTCDate()}`};
function windows(kind){
  const out=[];
  if(kind==='weekly'){const s=kstMs(2026,7,6);for(let i=0;i<12;i++)out.push({s:s+i*7*DAY,e:s+(i+1)*7*DAY})}
  else{[[7,8],[8,9],[9,10]].forEach(([m,n])=>out.push({s:kstMs(2026,m,1),e:kstMs(2026,n,1)}))}
  out.reverse().forEach((w,i)=>{w.i=i;w.short=kind==='weekly'?lbl(w.s):((new Date(w.s+KST)).getUTCMonth()+1)+'월';w.label=kind==='weekly'?`${lbl(w.s)}~${lbl(w.e-DAY)}`:w.short});
  return out}
function inWin(w){return S.reviews.filter(r=>{const t=+new Date(r.date);return t>=w.s&&t<w.e&&(!UI.store||r.store===UI.store)})}
function kpi(rs){
  const known=rs.filter(r=>r.replyKnown!==false),pub=known.filter(r=>r.reply?.publishedAt),neg=rs.filter(r=>r.rating<=2);
  const hrs=pub.map(r=>(new Date(r.reply.publishedAt)-new Date(r.date))/3600000).sort((a,b)=>a-b);
  return{n:rs.length,avg:avg(rs.map(r=>r.rating)),neg:neg.length,negRate:pct(neg.length,rs.length),resp:pct(pub.length,known.length),med:hrs.length?hrs[Math.floor(hrs.length/2)]:0};
}
function dcell(cur,prev,inv,suffix='',dec=0){
  if(prev===undefined||prev===null)return '';const d=cur-prev;if(Math.abs(d)<(dec?0.05:0.5))return `<span class="d-flat">변화 없음</span>`;
  const bad=inv?d<0:d>0;return `<span class="${bad?'d-up':'d-dn'}">${d>0?'+':'-'}${Math.abs(d).toFixed(dec)}${suffix}</span>`}

  const rd=[5,4,3,2,1].map(s=>({s,n:cr.filter(r=>r.rating===s).length}));

  <div class="sheet kpis">

    ${dist.slice().sort((a,b)=>b.n-a.n).map(d=>`<div class="vrow"><b>${d.v}</b><div><div class="bar"><i style="width:${d.n/maxN*100}%"></i></div><div class="bar" style="height:4px;margin-top:3px"><i style="width:${d.pn/maxN*100}%;background:#c9ced6"></i></div></div><span style="text-align:right"><span class="mute">${d.n}건</span> ${vocDelta(d)}</span></div>`).join('')}</div></div>
  <div class="sheet pad" style="margin-top:14px"><h3 style="font-size:15px;margin-bottom:8px">유형별 추이 <span class="mute" style="font-weight:400">건수가 많을수록 진합니다</span></h3><div style="overflow:auto"><table class="hm"><tr><th></th>${hm.map(h=>`<th style="text-align:center">${h.l}</th>`).join('')}</tr>
   ${VOC.map(v=>{const mx=Math.max(1,...hm.map(h=>h.by[v]));return `<tr><td style="text-align:left;white-space:nowrap">${v}</td>${hm.map(h=>{const n=h.by[v],a=n/mx;return `<td style="background:${v==='칭찬·만족'?'rgba(14,159,110,':'rgba(49,130,246,'}${(.07+a*.55).toFixed(2)});${a>.7?'color:#fff;':''}">${n}</td>`}).join('')}</tr>`}).join('')}</table></div></div>

function vocDelta(d){
  if(Math.max(d.n,d.pn)<5)return '<span class="d-flat">표본 적음</span>';
  if(d.pn<3){const bad=d.v!=='칭찬·만족';return `<span class="${bad?'d-up':'d-dn'}">+${d.n-d.pn}건</span>`}
  const ch=Math.round((d.n-d.pn)/d.pn*100);if(Math.abs(ch)<10)return '<span class="d-flat">비슷함</span>';
  const good=d.v==='칭찬·만족'?ch>0:ch<0;return `<span class="${good?'d-dn':'d-up'}">${ch>0?'+':'-'}${Math.abs(ch)}%</span>`;
}
function trendSvg(s){
  const W=640,H=210,pl=24,pr=24,pt=22,pb=34,n=s.length,bw=(W-pl-pr)/n,mx=Math.max(1,...s.map(x=>x.n))*1.15;
  const y=v=>pt+(H-pt-pb)*(1-.5*v/mx*1.15),ya=v=>pt+(H-pt-pb)*.4*(1-(v-1)/4)+4;
  let b='',pts=[];
  s.forEach((x,i)=>{const cx=pl+bw*i+bw/2;b+=`<rect x="${cx-bw*.32}" y="${y(x.n)}" width="${bw*.64}" height="${H-pb-y(x.n)}" rx="4" fill="${x.cur?'#3182f6':'#d6e6fd'}"/><text x="${cx}" y="${H-pb-6}" font-size="11" text-anchor="middle" fill="${x.cur?'#fff':'#4e5968'}">${x.n}</text><text x="${cx}" y="${H-pb+16}" font-size="11" text-anchor="middle" fill="#8b95a1">${x.l}</text>`;pts.push([cx,ya(x.a),x.a])});
  const line=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="기간별 리뷰 수와 평균 평점"><line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="#e5e8eb"/>${b}<path d="${line}" fill="none" stroke="#191f28" stroke-width="2"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#191f28"/><text x="${p[0]}" y="${p[1]-8}" font-size="11" font-weight="600" text-anchor="middle" fill="#191f28" style="paint-order:stroke;stroke:#fff;stroke-width:3px">${f1(p[2])}</text>`).join('')}</svg><div class="mute">막대는 리뷰 수, 검은 선은 평균 평점입니다.</div>`;
}
function topIssues(cr,pr){
  const out=[];
  VOC.filter(v=>!['칭찬·만족','기능 요청','기타'].includes(v)).forEach(v=>{
    const c=cr.filter(r=>r.voc===v&&r.rating<=3),q=pr.filter(r=>r.voc===v&&r.rating<=3);if(c.length<3)return;
    const g=q.length?(c.length-q.length)/q.length:1,w=c.some(r=>r.severity==='high')?2:c.some(r=>r.severity==='mid')?1.3:1;
    out.push({v,c,q,g,score:c.length*(1+Math.max(g,0))*w,small:c.length<10});
  });
  return out.sort((a,b)=>b.score-a.score).slice(0,3);
}
function impact(is,cr){const all=cr.map(r=>r.rating),ids=new Set(is.c.map(r=>r.id)),after=cr.map(r=>ids.has(r.id)&&r.rating<4?4:r.rating);return avg(after)-avg(all)}
function issueData(is,i){

  const kw={};is.c.forEach(r=>r.keywords.forEach(x=>kw[x]=(kw[x]||0)+1));

  const head=is.q.length?`${is.v} 불만 ${is.q.length}건에서 ${is.c.length}건으로 (${is.g>0?'+':''}${Math.round(is.g*100)}%)`:`${is.v} 불만 ${is.c.length}건 (비교 기간 없음)`;
  return{rank:i+1,v:is.v,head,n:is.c.length,avg:avg(is.c.map(r=>r.rating)),topV,st,kws:Object.entries(kw).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]),quotes,team:ACTION[is.v][0],act:ACTION[is.v][1],imp:impact(is,cr),share:pct(is.c.length,k.n),small:is.small,high:is.c.filter(r=>r.severity==='high').length};

   <p style="margin:0 0 8px">토스 운영팀이 Google Play에 실제로 남긴 답변 ${window.REVIEW_DATA.reviews.filter(r=>r.reply&&r.reply.source==='store').length}건을 색인해 두고, 새 리뷰와 가장 비슷한 사례 8건 중 서로 가장 일치하는 답변을 초안으로 고릅니다. 모델을 새로 학습시키는 방식은 아니고, 사례 검색 방식입니다.</p>
   <p class="mute" style="margin:0">오프라인 검증(학습 958건, 검증 252건): 실제 답변과의 평균 유사도 0.54, 무작위 답변은 0.31. 유사도가 높다고 해서 상황에 맞는 답변이라는 뜻은 아니므로 승인 전에 확인이 필요합니다. 검증 방법은 scripts/eval-retrieval.mjs에 있습니다.</p></div>
  <div class="sheet pad"><h3 style="font-size:15px;margin-bottom:10px">스토어 연동</h3>
   <table><tr><th>스토어</th><th>수집</th><th>게시</th></tr><tr><td>Google Play</td><td>공개 리뷰, 7~9월 전체</td><td>연동 보류, 수동 게시</td></tr><tr><td>App Store</td><td>공개 RSS, 8/8부터 최근 500건</td><td>연동 보류, 수동 게시</td></tr></table>
   <p class="mute">연동하면 reply-publisher 서브에이전트가 승인된 답변만 공식 API로 게시합니다.</p>
   <h3 style="font-size:15px;margin:18px 0 10px">내 작업 기록</h3><div class="row"><button class="btn" data-act="exportAll">reviews.json 내보내기</button><button class="btn" data-act="reset" style="color:var(--danger)">작업 기록 초기화</button></div>
   <p class="mute">리뷰 원본 데이터는 초기화해도 바뀌지 않습니다.</p></div></div>`;
}

/* ============ 이벤트 ============ */
function dl(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([typeof obj==='string'?obj:JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click()}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-nav],[data-sel],[data-act],[data-quick],[data-qtab],[data-per],[data-open]');if(!t)return;
  const d=t.dataset,R=id=>S.byId.get(id);
  if(d.nav){UI.page=d.nav;render();return}
  if(d.sel){UI.sel=d.sel;render();return}
  if(d.open){UI.page='inbox';UI.f={store:'',status:'',voc:'',rating:'',q:'',risk:false};UI.sel=d.open;render();return}
  if(d.quick){UI.f={store:d.quick==='unk'?'appstore':'',status:d.quick==='risk'?'':d.quick==='unk'?'new':d.quick,voc:'',rating:'',q:'',risk:d.quick==='risk'};render();return}
  if(d.qtab){UI.qtab=d.qtab;UI.qsel={};render();return}
  if(d.per){UI.period=d.per;UI.pidx=0;render();return}
  switch(d.act){
    case 'clearF':UI.f={store:'',status:'',voc:'',rating:'',q:'',risk:false};render();break;
    case 'draftAll':{const rs=S.reviews.filter(r=>r.status==='new'&&r.replyKnown!==false);rs.forEach(r=>draft(r));save();toast(`${rs.length}건의 초안을 만들었습니다. 승인 대기에서 확인하세요`);render();break}
    case 'draft':case 'regen':{const r=R(d.id);draft(r,true);r.reply.escAck=false;save();render();break}
    case 'useCase':{const r=R(d.id),c=R(d.case);if(c&&c.reply){r.reply.text=c.reply.text;if(r.reply.basis)r.reply.basis.chosen=c.id;r.reply.escAck=false;r._d=1;if(r.status==='approved')r.status='drafted';save();render()}break}
    case 'approve':{const r=R(d.id);if(approve(r)){save();toast('승인했습니다')}render();break}
    case 'publish':{const r=R(d.id);if(confirm('스토어 콘솔에 직접 게시를 마쳤나요?\n이 화면은 스토어로 전송하지 않고 완료 상태만 기록합니다.')&&publish(r)){save();toast('게시 완료로 표시했습니다')}render();break}
    case 'copy':{const r=R(d.id);navigator.clipboard.writeText(r.reply.text).then(()=>toast('답변을 복사했습니다'),()=>toast('복사하지 못했습니다. 직접 선택해 복사하세요'));break}
    case 'skip':{const r=R(d.id);r.status='skipped';r._d=1;save();render();break}
    case 'selAll':{S.reviews.filter(r=>r.status==='drafted').forEach(r=>{const c=checks(r);if(!(c.needEsc&&!r.reply.escAck)&&!c.errs.length)UI.qsel[r.id]=true});render();break}
    case 'bulkApprove':{let ok=0;Object.keys(UI.qsel).filter(i=>UI.qsel[i]).forEach(i=>{if(approve(R(i)))ok++});UI.qsel={};save();toast(`${ok}건 승인했습니다`);render();break}
    case 'bulkPublish':{if(!confirm('승인된 답변을 모두 스토어 콘솔에 게시했나요? 완료 상태로 기록합니다.'))break;let ok=0;S.reviews.filter(r=>r.status==='approved').forEach(r=>{if(publish(r))ok++});save();toast(`${ok}건을 게시 완료로 표시했습니다`);render();break}
    case 'exportQ':dl('approved_queue.json',S.reviews.filter(r=>r.status==='approved').map(r=>({id:r.id,store:r.store,replyText:r.reply.approvedText,approvedBy:r.reply.approvedBy,approvedAt:r.reply.approvedAt,needsEscalation:!!r.reply.needsEscalation,escalationAckBy:r.reply.escAck?r.reply.approvedBy:null})));break;
    case 'exportAll':dl('reviews.json',S.reviews.map(({_d,...x})=>x));break;
    case 'reset':if(confirm('이 브라우저에 저장된 초안과 승인 기록을 모두 지울까요?')){localStorage.removeItem(KEY);load();UI.sel=null;RX=null;render()}break;
    case 'copyMd':navigator.clipboard.writeText(reportMd()).then(()=>toast('마크다운을 복사했습니다'),()=>toast('복사하지 못했습니다'));break;
    case 'print':window.print();break;
  }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.item')){e.preventDefault();e.target.click()}});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(d.f!==undefined){UI.f[d.f]=t.type==='checkbox'?t.checked:t.value;render();return}
  if(t.id==='pidx'){UI.pidx=+t.value;render();return}
  if(t.id==='astore'){UI.store=t.value;render();return}
  if(d.set){S.settings[d.set]=t.type==='checkbox'?t.checked:t.value;save();render();return}
  if(d.sv){S.settings[d.sv]=t.value;save();toast('저장했습니다');render();return}
  if(d.q){UI.qsel[d.q]=t.checked;render();return}
  if(d.esc){const r=S.byId.get(d.esc);r.reply.escAck=t.checked;r._d=1;save();render();return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='fq'){UI.f.q=t.value;const p=t.selectionStart;render();const n=document.getElementById('fq');n.focus();n.setSelectionRange(p,p);return}
  if(t.dataset.reply){const r=S.byId.get(t.dataset.reply);r.reply.text=t.value;r._d=1;save();const c=checks(r);document.getElementById('cnt_'+r.id).textContent=`${c.len}/${c.lim}자 (${STORE[r.store]} 한도)`}
});
load();render();
</script>
</body>
</html>
